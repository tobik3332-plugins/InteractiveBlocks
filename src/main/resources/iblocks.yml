# Úložiště všech vytvořených bloků.
# Všechny in-game úpravy se automaticky ihned zapisují do tohoto souboru.

stone_na_spawnu:
  material: "STONE"
  world: "world"
  x: 0
  y: 64
  z: 0
  cooldown: 5
  interaction-type: "CLICK"
  permission: "iblock.use.spawn_stone"
  command:
    - "[player] shop"
    - "[console] give %player% diamond 1"
  message:
    - "[message] Gratuluji, našel jsi tajný blok!"
    - "[broadcast] Hráč %player% našel tajný blok na spawnu!"
